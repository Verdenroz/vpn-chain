[package]
name = "relayd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23.1"
getrandom = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "pem", "pkcs8"] }
relay-jobs = { version = "0.1.0", path = "../relay-jobs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }
xray-api = { path = "../xray-api" }

[dev-dependencies]
live-harness = { path = "../live-harness" }
tempfile = "3.27.0"
