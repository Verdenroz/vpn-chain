# vpn-chain: the handoff directory between the desktop app and the relay unit.
#
# The app writes relay.json here before starting vpn-chain-relay.service, and
# tails relay.log out of it afterwards. Owned by the service user, group-writable
# by `vpn-chain` so the app can write the config without any privilege at all.
#
# Deliberately a static tmpfiles entry rather than the unit's own
# RuntimeDirectory=: that would be created only once the service starts and
# removed again when it stops, and the config has to exist before either.
#
# Setgid (2770) matters: without it a config written by the app lands with the
# app user's primary group and the service cannot read it.
#
# cli/setup-desktop.sh rewrites the owner below to the user installing it, so the
# desktop app can write the config as the directory's owner. Owning it is what
# avoids putting that user in the `vpn-chain` group, which would not reach their
# already-running desktop session until the next login. The service reaches the
# directory through the group instead (SupplementaryGroups= in the unit).
d /run/vpn-chain 2770 sing-box vpn-chain -
