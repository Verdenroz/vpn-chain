# Fails when a tracked file points into a docs directory. User docs live in the
# README, maintainer docs in CONTRIBUTING.md, CLAUDE.md and code comments.
name: no-docs-dir

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The Public Suffix List is third-party and quotes URLs with that path.
      - run: |
          if git grep -n 'docs/' -- . ':!.github/workflows/no-docs-dir.yml' \
              ':!core/warp/src/jvmShared/resources/vpnchain/public_suffix_list.dat'; then
            echo "Point to the README, CONTRIBUTING.md or the code instead." >&2
            exit 1
          fi
