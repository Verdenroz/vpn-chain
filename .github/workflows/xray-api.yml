# Lint and test the relay's xray API client. The live job runs the client
# against a dockerised Xray and the sing-box clients the apps ship.
name: xray-api

on:
  pull_request:
    paths: ["relay/crates/xray-api/**", ".github/workflows/xray-api.yml"]
  push:
    branches: [main]
    paths: ["relay/crates/xray-api/**", ".github/workflows/xray-api.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: relay/crates/xray-api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  live:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: tests/fetch-bins.sh
      - run: cargo test --locked --test live -- --ignored
