# Checks the relayd workspace under relay/, which the Gradle build does not touch.
name: relay

on:
  push:
    branches: [main]
    paths: ["relay/**", "server/lib/pins.sh", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", "server/lib/pins.sh", ".github/workflows/relay.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
