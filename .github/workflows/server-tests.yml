# Runs the server script suites and the Xray x sing-box e2e matrix. The matrix also runs
# refuse.sh, which loads the egress rules from the static relayd.
name: server-tests

on:
  pull_request:
    paths: ["server/**", "relay/crates/relayd/src/egress*.rs", ".github/workflows/server-tests.yml"]
  push:
    branches: [main]
    paths: ["server/**", "relay/crates/relayd/src/egress*.rs", ".github/workflows/server-tests.yml"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Suites
        run: server/tests/run.sh
      - name: Toolchain for the static relayd
        working-directory: relay
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - name: Matrix
        env:
          KNOWN_BAD: "1"
        run: server/tests/matrix.sh
