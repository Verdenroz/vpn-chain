<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img"
     aria-label="Route: you, through the ProtonVPN entry hop, through the VLESS+REALITY relay VPS, exiting directly to the internet">
  <defs>
    <linearGradient id="chain" x1="60" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="lampFill" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5FE8B4"/>
      <stop offset="1" stop-color="#047857"/>
    </radialGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- panel / enclosure -->
  <rect x="1" y="1" width="918" height="218" rx="18" fill="#0A1411"/>
  <rect x="1.5" y="1.5" width="917" height="217" rx="17.5" fill="none" stroke="url(#bezel)" stroke-width="1.5"/>

  <text x="28" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        letter-spacing="3" fill="#5C6E67">ROUTE</text>

  <!-- connector: you -> proton (chained, active) -->
  <line x1="88" y1="120" x2="298" y2="120" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
  <text x="193" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        fill="#7C9089" text-anchor="middle">hides you from the VPS</text>

  <!-- connector: proton -> relay (chained, active) -->
  <line x1="356" y1="120" x2="564" y2="120" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
  <text x="460" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        fill="#7C9089" text-anchor="middle">disguised as HTTPS to your SNI</text>

  <!-- connector: relay -> internet (plain exit, not chained) -->
  <line x1="622" y1="120" x2="832" y2="120" stroke="#3A4A44" stroke-width="2.5" stroke-dasharray="1 9"
        stroke-linecap="round"/>
  <text x="727" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        fill="#5C6E67" text-anchor="middle">exits directly</text>

  <!-- node: you (unlit — origin) -->
  <circle cx="60" cy="120" r="10" fill="#0A1411" stroke="#4B5D57" stroke-width="2"/>
  <text x="60" y="155" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600"
        letter-spacing="2" fill="#C9D6D0" text-anchor="middle">YOU</text>
  <text x="60" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10"
        fill="#55665F" text-anchor="middle">real IP hidden</text>

  <!-- node: protonvpn (lit — entry hop) -->
  <circle cx="327" cy="120" r="22" fill="url(#lampFill)" filter="url(#bloom)" opacity="0.55"/>
  <circle cx="327" cy="120" r="13" fill="url(#lampFill)"/>
  <text x="327" y="155" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600"
        letter-spacing="2" fill="#C9D6D0" text-anchor="middle">PROTONVPN</text>
  <text x="327" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10"
        fill="#55665F" text-anchor="middle">entry hop</text>

  <!-- node: relay vps (lit — exit hop) -->
  <circle cx="593" cy="120" r="22" fill="url(#lampFill)" filter="url(#bloom)" opacity="0.55"/>
  <circle cx="593" cy="120" r="13" fill="url(#lampFill)"/>
  <text x="593" y="155" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600"
        letter-spacing="2" fill="#C9D6D0" text-anchor="middle">RELAY VPS</text>
  <text x="593" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10"
        fill="#55665F" text-anchor="middle">exit — VLESS+REALITY</text>

  <!-- node: internet (unlit — destination) -->
  <circle cx="860" cy="120" r="10" fill="#0A1411" stroke="#4B5D57" stroke-width="2"/>
  <text x="860" y="155" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600"
        letter-spacing="2" fill="#C9D6D0" text-anchor="middle">INTERNET</text>
</svg>
