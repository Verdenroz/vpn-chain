<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- vpn-chain app icon: the mark from logo.svg on a near-black tile.
       Used for desktop launchers (hicolor/wofi), window icon, and jpackage. -->
  <defs>
    <linearGradient id="chain" x1="68" y1="68" x2="444" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <clipPath id="under-crossing">
      <rect x="140" y="280" width="92" height="92"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" fill="#0A1411"/>

  <g transform="translate(38.4,38.4) scale(0.85)">
    <rect x="186" y="186" width="236" height="236" rx="84" fill="none"
          stroke="url(#chain)" stroke-width="44"/>
    <rect x="90" y="90" width="236" height="236" rx="84" fill="none"
          stroke="url(#chain)" stroke-width="44"/>
    <g clip-path="url(#under-crossing)">
      <rect x="186" y="186" width="236" height="236" rx="84" fill="none"
            stroke="url(#chain)" stroke-width="44"/>
    </g>
    <circle cx="160" cy="160" r="18" fill="url(#chain)"/>
    <circle cx="256" cy="256" r="26" fill="url(#chain)"/>
    <circle cx="352" cy="352" r="18" fill="url(#chain)"/>
  </g>
</svg>
