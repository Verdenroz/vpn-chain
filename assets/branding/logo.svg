<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- vpn-chain mark: two interlocked chain links, three hop nodes on the
       diagonal (entry, relay, exit). Weave: link A over B at the top-right
       crossing, B over A at the bottom-left. Transparent background — the
       mark is designed to sit on both black and white. -->
  <defs>
    <linearGradient id="chain" x1="68" y1="68" x2="444" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <clipPath id="under-crossing">
      <rect x="140" y="280" width="92" height="92"/>
    </clipPath>
  </defs>

  <!-- link B (lower-right) -->
  <rect x="186" y="186" width="236" height="236" rx="84" fill="none"
        stroke="url(#chain)" stroke-width="44"/>
  <!-- link A (upper-left), drawn over B -->
  <rect x="90" y="90" width="236" height="236" rx="84" fill="none"
        stroke="url(#chain)" stroke-width="44"/>
  <!-- re-draw B over A at the bottom-left crossing to complete the weave -->
  <g clip-path="url(#under-crossing)">
    <rect x="186" y="186" width="236" height="236" rx="84" fill="none"
          stroke="url(#chain)" stroke-width="44"/>
  </g>

  <!-- the three hops: entry, relay (shared tunnel), exit -->
  <circle cx="160" cy="160" r="18" fill="url(#chain)"/>
  <circle cx="256" cy="256" r="26" fill="url(#chain)"/>
  <circle cx="352" cy="352" r="18" fill="url(#chain)"/>
</svg>
